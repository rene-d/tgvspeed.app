# Construit TGVSpeed.app et publie une release à partir d'un tag `v*`.
#
# Signature ad-hoc : l'application n'est pas notarisée, faute de compte Apple
# Developer. Les instructions de contournement de Gatekeeper sont dans le
# README et rappelées dans le corps de la release.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version à construire, sans le v (ex. 1.0.1). Sans publication."
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version='${{ inputs.version }}'
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version=$version, build=$GITHUB_RUN_NUMBER"

      # Info.plist fige 1.0.0 dans le dépôt : la release porte le tag.
      - name: Numéroter le bundle
        run: |
          plist=Support/Info.plist
          /usr/libexec/PlistBuddy -c \
            "Set :CFBundleShortVersionString ${{ steps.version.outputs.version }}" "$plist"
          /usr/libexec/PlistBuddy -c \
            "Set :CFBundleVersion $GITHUB_RUN_NUMBER" "$plist"

      - name: Environnement
        run: |
          sw_vers
          swift --version

      # Le simulateur rend `make check` hermétique : aucun accès à wifi.sncf,
      # qui n'est joignable qu'à bord.
      - name: Test — menu construit contre le simulateur
        run: make check

      - name: Build universel
        run: make universal

      - name: Vérifications du bundle
        run: |
          lipo -archs TGVSpeed.app/Contents/MacOS/TGVSpeed
          lipo -archs TGVSpeed.app/Contents/MacOS/TGVSpeed | grep -q x86_64
          lipo -archs TGVSpeed.app/Contents/MacOS/TGVSpeed | grep -q arm64
          plutil -lint TGVSpeed.app/Contents/Info.plist
          codesign --verify --deep --strict --verbose=2 TGVSpeed.app

      - name: Image disque
        id: dmg
        run: |
          make dmg
          name="TGVSpeed-${{ steps.version.outputs.version }}.dmg"
          mv TGVSpeed.dmg "$name"
          shasum -a 256 "$name" | tee "$name.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.dmg.outputs.name }}
          path: |
            ${{ steps.dmg.outputs.name }}
            ${{ steps.dmg.outputs.name }}.sha256

      - name: Publier la release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          Application universelle arm64 + x86_64, macOS 14 minimum.

          ### Installation

          Ouvrir l'image disque, glisser **TGVSpeed** dans *Applications*, puis :

          ```shell
          xattr -dr com.apple.quarantine /Applications/TGVSpeed.app
          ```

          L'application est signée en ad-hoc et non notarisée : sans cette commande,
          macOS refuse de l'ouvrir. À défaut, un ⌃-clic sur l'application puis
          *Ouvrir* fonctionne aussi.
          EOF
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --generate-notes \
            "${{ steps.dmg.outputs.name }}" \
            "${{ steps.dmg.outputs.name }}.sha256"
